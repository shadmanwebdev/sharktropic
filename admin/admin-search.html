<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Search Box</title>
</head>
<body>

    <style>
        body {
            background-color: #1f2d3d; /* Adjusted to match the dark background */
            font-family: Arial, sans-serif;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .search-box {
            width: 300px;
            padding: 10px 20px;
            border-radius: 20px; /* Rounded corners */
            border: none;
            outline: none;
            font-size: 16px;
            color: #fff; /* White text color */
            background-color: #2c3e50; /* Dark background color */
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5); /* Inner shadow */
        }

        .search-box::placeholder {
            color: #b0b0b0; /* Light gray placeholder text */
        }

        .search-box:focus {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Shadow on focus */
        }

    </style>


    
    <div class="search-container">
        <input type="text" class="search-box" placeholder="Search here...">
    </div>
</body>
</html>
